<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="prof-styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap"
      rel="stylesheet"
    />
  </head>
</html>
<body>
  <div class="card">
    <img src="../img/headshot.png" alt="Jackson Kent" class="headshot" />
    <h2 class="name">Jackson Kent</h2>
    <p class="bio">
      Research and analytics specialist. Building data products that move the
      needle.
    </p>
    <button>Follow</button>
    <section class="chart-section" aria-labelledby="chart-title">
      <h3 id="chart-title">Values by letter</h3>
      <svg id="bar-chart" role="img" aria-labelledby="chart-title"></svg>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="bar-chart.js"></script>
</body>
